name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (macOS)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Print Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run Test Suite
        run: swift test

      - name: Build app bundle
        run: make build

      - name: Verify app bundle
        run: |
          test -x .build/Atlas.app/Contents/MacOS/Atlas
          test -f .build/Atlas.app/Contents/Resources/KeyboardShortcuts_KeyboardShortcuts.bundle/Contents/Info.plist
          plutil -extract LSMinimumSystemVersion raw .build/Atlas.app/Contents/Info.plist | grep -qx 14.0
          codesign --verify --deep --strict .build/Atlas.app
